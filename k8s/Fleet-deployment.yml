apiVersion: apps/v1
kind: Deployment
metadata:
  name: fedcarrier-Fleet
  namespace: fedcarrier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fedcarrier-Fleet
  template:
    metadata:
      labels:
        app: fedcarrier-Fleet
    spec:
      containers:
        - name: Fleet
          image: ghcr.io/fedcarrier/fedcarrier-
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: fedcarrier-secrets
                  key: Fleet-connection-string
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: fedcarrier-Fleet
  namespace: fedcarrier
spec:
  selector:
    app: fedcarrier-Fleet
  ports:
    - port: 500Fleet.Length
      targetPort: 8080
  type: ClusterIP
