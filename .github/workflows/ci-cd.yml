name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOTNET_VERSION: '8.0.x'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/fedcarrier

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project:
          - src/shared/FedCarrier.Common
          - src/shared/FedCarrier.Contracts
          - src/shared/FedCarrier.Infrastructure
          - src/gateways/FedCarrier.Gateway
          - src/services/FedCarrier.Identity
          - src/services/FedCarrier.Customer
          - src/services/FedCarrier.Shipment
          - src/services/FedCarrier.Order
          - src/services/FedCarrier.Warehouse
          - src/services/FedCarrier.Fleet
          - src/services/FedCarrier.Driver
          - src/services/FedCarrier.Routing
          - src/services/FedCarrier.Tracking
          - src/services/FedCarrier.Billing
          - src/services/FedCarrier.Notification
          - src/services/FedCarrier.Reporting

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore ${{ matrix.project }}

      - name: Build
        run: dotnet build ${{ matrix.project }} --no-restore -c Release

      - name: Test
        run: dotnet test ${{ matrix.project }} --no-build -c Release --verbosity normal

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    strategy:
      matrix:
        service:
          - FedCarrier.Gateway
          - FedCarrier.Identity
          - FedCarrier.Customer
          - FedCarrier.Shipment
          - FedCarrier.Order
          - FedCarrier.Warehouse
          - FedCarrier.Fleet
          - FedCarrier.Driver
          - FedCarrier.Routing
          - FedCarrier.Tracking
          - FedCarrier.Billing
          - FedCarrier.Notification
          - FedCarrier.Reporting

    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service }}:latest

  deploy-staging:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to staging
        run: echo 'Deploy to staging Kubernetes cluster'

  deploy-production:
    needs: docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to production
        run: echo 'Deploy to production Kubernetes cluster'
