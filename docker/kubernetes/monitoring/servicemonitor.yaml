apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fedcarrier-services
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: fedcarrier
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - fedcarrier
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: fedcarrier-infrastructure
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: infrastructure
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - infrastructure
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: fedcarrier-pods
  namespace: monitoring
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: fedcarrier
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
  namespaceSelector:
    matchNames:
      - fedcarrier